[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-ocp-tts-plugin"
version = "0.1.0a2"
description = "OCP stream extractor for text read aloud: tts// uris play as sentences spoken in the device's own voice, rendered by ovos-audio"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Andreas Lorensen"}]
requires-python = ">=3.10"
keywords = ["ovos", "openvoiceos", "plugin", "ocp", "stream-extractor", "tts", "reading", "ovos-media", "emkay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "ovos-plugin-manager>=0.0.26",
    "ovos-utils>=0.0.38",
    "ovos-bus-client>=0.0.8",
    "ovos-config>=0.0.12",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/emkay-voice/ovos-ocp-tts-plugin"
Issues = "https://github.com/emkay-voice/ovos-ocp-tts-plugin/issues"
Discussion = "https://github.com/OpenVoiceOS/ovos-media/issues/240"

[project.entry-points."opm.ocp.extractor"]
ovos-ocp-tts-plugin = "ovos_ocp_tts_plugin:OCPTTSExtractor"

[tool.setuptools]
packages = ["ovos_ocp_tts_plugin"]
